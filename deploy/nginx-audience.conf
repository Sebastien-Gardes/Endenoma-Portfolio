# ─────────────────────────────────────────────────────────────
#  endenoma.studio — mesure d'audience sans cookie.
#  → /etc/nginx/conf.d/endenoma-audience.conf
#
#  Ce fichier définit un journal d'accès dédié à la mesure
#  d'audience, dans lequel l'adresse IP est tronquée AVANT
#  écriture sur le disque. Aucune adresse IP complète n'est
#  donc jamais stockée dans ce journal.
#
#  Il doit être chargé au niveau « http », donc placé dans
#  conf.d/ : la configuration Debian/Ubuntu par défaut inclut
#  conf.d/*.conf avant sites-enabled/*, ce qui garantit que la
#  map et le format sont connus avant que le vhost ne s'en
#  serve.
# ─────────────────────────────────────────────────────────────

# Troncature de l'adresse IP.
#   IPv4  : le dernier octet est remplacé par 0   (192.0.2.37  → 192.0.2.0)
#   IPv6  : seuls les deux premiers groupes sont conservés
#           (2001:db8:1234::1 → 2001:db8::)
#           La seconde règle traite les adresses abrégées dès
#           le deuxième groupe (fe80::1 → fe80::), qu'une règle
#           unique rendrait malformées.
#   Autre : 0.0.0.0
# C'est la troncature recommandée par la CNIL pour la mesure
# d'audience exemptée de consentement.
#
# Les expressions régulières sont entre guillemets : sans eux,
# nginx prendrait une accolade de quantificateur pour un début
# de bloc et refuserait de démarrer.
map $remote_addr $endenoma_ip_tronquee {
    default                                      "0.0.0.0";
    "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"              "$v4.0";
    "~^(?<v6>[0-9a-fA-F]+:[0-9a-fA-F]+):"        "$v6::";
    "~^(?<v6court>[0-9a-fA-F]+)::"               "$v6court::";
}

# Format COMBINED standard, à ceci près que $remote_addr est
# remplacé par sa version tronquée. GoAccess le lit tel quel
# avec --log-format=COMBINED.
log_format endenoma_audience
    '$endenoma_ip_tronquee - - [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
