# ─────────────────────────────────────────────────────────────
#  endenoma.studio — vhost nginx, HTTPS.
#  → /etc/nginx/sites-available/endenoma.studio
#
#  Réglages TLS intégrés directement : ce fichier ne dépend
#  d'aucun include externe, donc pas besoin du paquet
#  python3-certbot-nginx.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name endenoma.studio www.endenoma.studio;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/endenoma.studio;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://endenoma.studio$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.endenoma.studio;

    ssl_certificate     /etc/letsencrypt/live/endenoma.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/endenoma.studio/privkey.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    return 301 https://endenoma.studio$request_uri;
}

server {
    listen 443 ssl http2;
    server_name endenoma.studio;

    root /var/www/endenoma.studio;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/endenoma.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/endenoma.studio/privkey.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json image/svg+xml;

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    location = /logos-data.js {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
